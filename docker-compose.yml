services:
  app:
    image: ghcr.io/charmthiekshanaperera/mega-pharma-website-app:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks: [app]

  nginx:
    image: ghcr.io/charmthiekshanaperera/mega-pharma-website-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    networks: [app]

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]

  queue:
    image: ghcr.io/charmthiekshanaperera/mega-pharma-website-app:latest
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3"]
    env_file: .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks: [app]

volumes:
  db_data:
  storage_data:

networks:
  app:
